name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: quartz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: quartz/package-lock.json

      - name: Cache npm dependencies
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: quartz/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('quartz/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install dependencies (if cache miss)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: quartz

      - name: Cache Quartz community plugins
        uses: actions/cache@v4
        id: plugins-cache
        with:
          path: quartz/.quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz/quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-quartz-plugins-

      - name: Install Quartz plugins (if cache miss)
        if: steps.plugins-cache.outputs.cache-hit != 'true'
        run: npx quartz plugin install
        working-directory: quartz

      - name: Cache Quartz build artifacts
        uses: actions/cache@v4
        id: build-cache
        with:
          path: |
            quartz/public
            quartz/.quartz/.cache
          key: ${{ runner.os }}-quartz-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-quartz-build-

      - name: Build Quartz site (if cache miss)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          npx quartz build
          
          # Create robots.txt for GitHub Pages
          cat > public/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://njuyoung35.github.io/sitemap.xml
          EOF
          
          # Create .nojekyll to serve _-prefixed paths
          touch public/.nojekyll
        working-directory: quartz

      - name: Format sitemap.xml
        if: hashFiles('quartz/public/sitemap.xml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --format public/sitemap.xml > public/sitemap.formatted.xml
          mv public/sitemap.formatted.xml public/sitemap.xml
          echo "Sitemap formatted successfully"
        working-directory: quartz

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
