name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: quartz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: true
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: quartz/package-lock.json

      - name: Cache npm dependencies
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: quartz/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('quartz/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-

      - name: Install dependencies (if cache miss)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: quartz

      - name: Cache Quartz community plugins
        uses: actions/cache@v4
        id: plugins-cache
        with:
          path: quartz/.quartz/plugins
          key: ${{ runner.os }}-quartz-plugins-${{ hashFiles('quartz/quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-quartz-plugins-

      - name: Install Quartz plugins (if cache miss)
        if: steps.plugins-cache.outputs.cache-hit != 'true'
        run: npx quartz plugin install
        working-directory: quartz

      # ============================================================
      # 📦 스마트 증분 복사 (rsync + 체크섬 기반)
      # ============================================================
      - name: Smart incremental sync (content, styles & configs)
        id: sync
        run: |
          echo "🚀 Starting smart incremental sync..."

          # 1. content 동기화
          if [ -d "../content" ]; then
            echo "📁 Syncing content..."
            rsync -av --delete --exclude='.git' --exclude='.DS_Store' ../content/ content/
            echo "HAS_CONTENT=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No content directory found"
            echo "HAS_CONTENT=false" >> $GITHUB_OUTPUT
          fi

          # 2. styles 동기화
          if [ -d "../00_System/quartz-config/styles" ]; then
            echo "🎨 Syncing styles..."
            rsync -av --delete --exclude='.git' --exclude='.DS_Store' ../00_System/quartz-config/styles/ styles/
            echo "HAS_STYLES=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_STYLES=false" >> $GITHUB_OUTPUT
          fi

          # 🆕 3. 설정 파일 동기화 (루트 디렉토리에 있는 경우)
          if [ -f "../00_System/quartz-config/quartz.config.ts" ]; then
            echo "⚙️ Copying quartz.config.ts..."
            cp ../00_System/quartz-config/quartz.config.ts ./
            echo "HAS_CONFIG=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No custom quartz.config.ts found, using submodule default"
            echo "HAS_CONFIG=false" >> $GITHUB_OUTPUT
          fi

          if [ -f "../00_System/quartz-config/quartz.layout.ts" ]; then
            echo "📐 Copying quartz.layout.ts..."
            cp ../00_System/quartz-config/quartz.layout.ts ./
            echo "HAS_LAYOUT=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No custom quartz.layout.ts found, using submodule default"
            echo "HAS_LAYOUT=false" >> $GITHUB_OUTPUT
          fi

          # 4. 통계 정보 출력
          echo "📊 Sync statistics:"
          echo "  - Content files: $(find content -type f 2>/dev/null | wc -l)"
          echo "  - Styles files:  $(find styles -type f 2>/dev/null | wc -l)"
          if [ -f "quartz.config.ts" ]; then echo "  - ✅ Custom config exists"; fi
          if [ -f "quartz.layout.ts" ]; then echo "  - ✅ Custom layout exists"; fi

          # 5. 변경 감지용 해시 생성 (캐시 키용)
          CONTENT_HASH=$(find ../content -type f -exec md5sum {} \; 2>/dev/null | sort | md5sum | cut -d' ' -f1 || echo "none")
          STYLES_HASH=$(find ../00_System/quartz-config/styles -type f -exec md5sum {} \; 2>/dev/null | sort | md5sum | cut -d' ' -f1 || echo "none")
          CONFIG_HASH=$(md5sum ../00_System/quartz-config/quartz.config.ts 2>/dev/null | cut -d' ' -f1 || echo "none")
          LAYOUT_HASH=$(md5sum ../00_System/quartz-config/quartz.layout.ts 2>/dev/null | cut -d' ' -f1 || echo "none")
          
          echo "CONTENT_HASH=$CONTENT_HASH" >> $GITHUB_OUTPUT
          echo "STYLES_HASH=$STYLES_HASH" >> $GITHUB_OUTPUT
          echo "CONFIG_HASH=$CONFIG_HASH" >> $GITHUB_OUTPUT
          echo "LAYOUT_HASH=$LAYOUT_HASH" >> $GITHUB_OUTPUT
          echo "TOTAL_HASH=${CONTENT_HASH}-${STYLES_HASH}-${CONFIG_HASH}-${LAYOUT_HASH}" >> $GITHUB_OUTPUT

          echo "✅ Incremental sync completed"
        working-directory: quartz

      - name: Cache Quartz build artifacts
        uses: actions/cache@v4
        id: build-cache
        with:
          path: |
            quartz/public
            quartz/.quartz/.cache
          key: ${{ runner.os }}-quartz-build-${{ steps.sync.outputs.TOTAL_HASH }}
          restore-keys: |
            ${{ runner.os }}-quartz-build-

      - name: Build Quartz site (if cache miss)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          echo "🔨 Building Quartz site..."
          npx quartz build
          
          # Create robots.txt for GitHub Pages
          cat > public/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://njuyoung35.github.io/sitemap.xml
          EOF
          
          # Create .nojekyll to serve _-prefixed paths
          touch public/.nojekyll

          echo "✅ Build completed"
        working-directory: quartz

      - name: Format sitemap.xml
        if: hashFiles('quartz/public/sitemap.xml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
          xmllint --format public/sitemap.xml > public/sitemap.formatted.xml
          mv public/sitemap.formatted.xml public/sitemap.xml
          echo "Sitemap formatted successfully"
        working-directory: quartz

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
